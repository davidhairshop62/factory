<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory ERP - 거래처 포털</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#090E17',
                card: '#131B2B',
                cardHover: '#1A2438',
                border: '#28354D',
                gold: '#F59E0B',
                goldHover: '#D97706',
                emerald: '#10B981',
                slateText: '#94A3B8'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- 상단 네비게이션 바 -->
    <header class="w-full bg-brand-card border-b border-brand-border sticky top-0 z-50 px-4 sm:px-6 h-16 flex items-center justify-between">
        
        <!-- 좌측: 브랜드 로고 & 거래처 메뉴 목록 -->
        <div class="flex items-center space-x-6">
            <a href="cust_dashboard.html" class="flex items-center space-x-2.5 hover:opacity-90 transition-opacity">
                <div class="w-8 h-8 rounded-lg bg-brand-emerald/15 border border-brand-emerald/40 flex items-center justify-center text-brand-emerald">
                    <span class="material-symbols-outlined text-lg">storefront</span>
                </div>
                <span class="font-display font-bold text-base tracking-wide text-white">FACTORY ERP</span>
                <span class="hidden sm:inline-block text-[11px] font-mono text-brand-emerald px-1.5 py-0.5 rounded bg-brand-emerald/10 border border-brand-emerald/20">CLIENT</span>
            </a>

            <!-- 네비게이션 바 메뉴 -->
            <nav class="hidden md:flex items-center space-x-1 pl-4 border-l border-brand-border text-sm">
                <a href="#" class="px-3 py-1.5 rounded-lg bg-brand-emerald/15 text-brand-emerald font-medium border border-brand-emerald/30 flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-base">dashboard</span>
                    <span>대시보드</span>
                </a>
                <a href="#" class="px-3 py-1.5 rounded-lg text-brand-slateText hover:text-white hover:bg-brand-cardHover transition-colors flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-base">add_circle</span>
                    <span>신규 발주</span>
                </a>
                <a href="#" class="px-3 py-1.5 rounded-lg text-brand-slateText hover:text-white hover:bg-brand-cardHover transition-colors flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-base">local_shipping</span>
                    <span>주문 / 배송 조회</span>
                </a>
                <a href="#" class="px-3 py-1.5 rounded-lg text-brand-slateText hover:text-white hover:bg-brand-cardHover transition-colors flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-base">replay</span>
                    <span>원클릭 재주문</span>
                </a>
                <a href="#" class="px-3 py-1.5 rounded-lg text-brand-slateText hover:text-white hover:bg-brand-cardHover transition-colors flex items-center space-x-1.5">
                    <span class="material-symbols-outlined text-base">receipt</span>
                    <span>정산 / 인보이스</span>
                </a>
            </nav>
        </div>

        <!-- 우측: 거래처 식별 정보 & 로그아웃 버튼 -->
        <div class="flex items-center space-x-3">
            <div class="hidden sm:flex items-center space-x-2 text-xs font-mono text-brand-slateText pr-2">
                <span class="w-2 h-2 rounded-full bg-brand-emerald animate-pulse"></span>
                <span id="userNameText" class="text-slate-200">김원장</span>
                <span id="userCompanyText" class="text-slate-400 font-sans">(Melbourne Prestige Hair Studio)</span>
            </div>

            <!-- 로그아웃 버튼 -->
            <button type="button" onclick="handleLogout()"
                    class="px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 border border-red-500/40 text-red-300 hover:text-red-200 text-xs font-medium transition-colors flex items-center space-x-1.5">
                <span class="material-symbols-outlined text-base">logout</span>
                <span>로그아웃</span>
            </button>
        </div>
    </header>

    <!-- 메인 바디 영역 (순수 빈 캔버스) -->
    <main id="main-content" class="flex-1 w-full max-w-7xl mx-auto p-6">
    </main>

    <!-- 자바스크립트: 세션 점검 및 로그아웃 처리 -->
    <script>
        // 세션 점검
        async function checkSession() {
            try {
                const res = await fetch('api_me.php');
                const data = await res.json();
                if (data.authenticated && data.user) {
                    if (data.user.user_type === 'ADMIN') {
                        // 관리자면 관리자 콘솔로 이동
                        window.location.href = 'admin-dashboard.html';
                        return;
                    }
                    document.getElementById('userNameText').textContent = data.user.name || data.user.username;
                    if (data.user.company_name) {
                        document.getElementById('userCompanyText').textContent = `(${data.user.company_name})`;
                    }
                }
            } catch (e) {}
        }
        checkSession();

        // 로그아웃
        async function handleLogout() {
            if (!confirm('로그아웃 하시겠습니까?')) return;
            try {
                await fetch('api_logout.php');
            } catch (e) {}
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
