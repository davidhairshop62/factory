<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory ERP - 맞춤형 헤어제품 통합 관리 시스템</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#090E17',
                card: '#131B2B',
                cardHover: '#1A2438',
                border: '#28354D',
                gold: '#F59E0B',
                goldHover: '#D97706',
                emerald: '#10B981',
                slateText: '#94A3B8'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      .bg-grid {
        background-size: 32px 32px;
        background-image: 
          linear-gradient(to right, rgba(40, 53, 77, 0.2) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(40, 53, 77, 0.2) 1px, transparent 1px);
      }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased bg-grid p-4 sm:p-6">

    <!-- 상단 간이 상태바 -->
    <header class="w-full max-w-md mx-auto flex items-center justify-between text-xs font-mono text-brand-slateText pt-2 pb-4">
        <div class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-brand-emerald animate-pulse"></span>
            <span class="text-slate-300">SYSTEM: NORMAL</span>
        </div>
        <div id="live-time" class="text-slate-400">UTC --:--:--</div>
    </header>

    <!-- 메인 로그인 카드 컨테이너 -->
    <main class="w-full max-w-md mx-auto my-auto">
        <div class="bg-brand-card border border-brand-border rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-sm">
            
            <!-- 로고 및 서비스 타이틀 -->
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-gold/10 border border-brand-gold/30 text-brand-gold mb-3 shadow-inner">
                    <span class="material-symbols-outlined text-2xl">precision_manufacturing</span>
                </div>
                <h1 class="font-display font-bold text-2xl text-white tracking-tight">FACTORY ERP</h1>
                <p class="text-xs text-brand-slateText mt-1">맞춤형 헤어제품 주문·생산·회계 통합 시스템</p>
            </div>

            <!-- 테스트 계정 원클릭 입력 버튼 -->
            <div class="mb-5 bg-brand-dark/70 border border-brand-border/60 rounded-xl p-3">
                <div class="text-[11px] font-mono text-brand-slateText mb-2 text-center">빠른 테스트 계정 선택</div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="setAccount('admin', 'admin1234!')" 
                            class="px-2.5 py-1.5 rounded-lg bg-brand-gold/15 hover:bg-brand-gold/25 border border-brand-gold/40 text-brand-gold text-xs font-medium transition-all flex items-center justify-center space-x-1">
                        <span class="material-symbols-outlined text-sm">admin_panel_settings</span>
                        <span>관리자 로그인</span>
                    </button>
                    <button type="button" onclick="setAccount('client_test', 'client1234!')" 
                            class="px-2.5 py-1.5 rounded-lg bg-brand-emerald/15 hover:bg-brand-emerald/25 border border-brand-emerald/40 text-brand-emerald text-xs font-medium transition-all flex items-center justify-center space-x-1">
                        <span class="material-symbols-outlined text-sm">storefront</span>
                        <span>거래처 로그인</span>
                    </button>
                </div>
            </div>

            <!-- 로그인 폼 -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <!-- 아이디/이메일 입력 -->
                <div>
                    <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5">
                        아이디 또는 이메일
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <span class="material-symbols-outlined text-lg">person</span>
                        </span>
                        <input type="text" id="username" required
                               class="w-full pl-9 pr-3 py-2.5 bg-brand-dark border border-brand-border rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold transition-colors font-mono"
                               placeholder="아이디를 입력하세요" value="admin">
                    </div>
                </div>

                <!-- 비밀번호 입력 -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-medium text-slate-300">
                            비밀번호
                        </label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <span class="material-symbols-outlined text-lg">lock</span>
                        </span>
                        <input type="password" id="password" required
                               class="w-full pl-9 pr-10 py-2.5 bg-brand-dark border border-brand-border rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold transition-colors font-mono"
                               placeholder="비밀번호를 입력하세요" value="admin1234!">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none">
                            <span id="pwdEyeIcon" class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- 결과 메시지 알림 박스 -->
                <div id="alertBox" class="hidden text-xs rounded-lg p-3 font-mono transition-all"></div>

                <!-- 로그인 버튼 -->
                <button type="submit" id="submitBtn"
                        class="w-full py-2.5 px-4 rounded-lg bg-brand-gold hover:bg-brand-goldHover text-brand-dark font-display font-bold text-sm tracking-wide transition-all shadow-lg shadow-brand-gold/20 flex items-center justify-center space-x-1.5 active:scale-[0.99]">
                    <span id="btnText">로그인</span>
                    <span class="material-symbols-outlined text-base font-bold">arrow_forward</span>
                </button>
            </form>

            <!-- 권한별 분기 안내 가이드 -->
            <div class="mt-6 pt-5 border-t border-brand-border/60 text-[11px] text-brand-slateText space-y-1 text-center font-mono">
                <div>• 관리자 로그인 시 <span class="text-brand-gold font-medium">관리자 콘솔</span>로 자동 이동</div>
                <div>• 거래처 로그인 시 <span class="text-brand-emerald font-medium">거래처 포털</span>로 자동 이동</div>
            </div>
        </div>
    </main>

    <!-- 하단 카피라이트 -->
    <footer class="w-full max-w-md mx-auto text-center text-[11px] font-mono text-slate-500 py-3">
        Factory ERP &copy; 2026 David Hair Shop. All rights reserved.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        // 실시간 UTC 시계
        function updateTime() {
            const now = new Date();
            const timeStr = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            document.getElementById('live-time').textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 계정 자동 입력
        function setAccount(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            const alert = document.getElementById('alertBox');
            alert.className = 'text-xs rounded-lg p-3 font-mono bg-brand-dark/80 border border-brand-gold/40 text-brand-gold block';
            alert.textContent = `계정 정보가 입력되었습니다 (${u === 'admin' ? '관리자 권한' : '거래처 권한'}). 로그인 버튼을 눌러주세요.`;
        }

        // 비밀번호 보이기/숨기기
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('pwdEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // 로그인 처리
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            if (!username || !password) {
                alertBox.className = 'text-xs rounded-lg p-3 font-mono bg-red-950/60 border border-red-500/50 text-red-300 block';
                alertBox.textContent = '아이디와 비밀번호를 모두 입력해 주세요.';
                return;
            }

            // 로딩 상태 표시
            submitBtn.disabled = true;
            btnText.textContent = '인증 확인 중...';
            alertBox.className = 'text-xs rounded-lg p-3 font-mono bg-slate-800 border border-slate-700 text-slate-300 block';
            alertBox.textContent = '서버에 계정 인증을 요청하고 있습니다...';

            try {
                const response = await fetch('api_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    const roleLabel = data.user.user_type === 'ADMIN' ? '관리자' : '거래처';
                    alertBox.className = 'text-xs rounded-lg p-3 font-mono bg-emerald-950/60 border border-brand-emerald/50 text-brand-emerald block';
                    alertBox.innerHTML = `<strong>✓ 인증 성공 (${roleLabel})</strong><br>${data.user.name}님 환영합니다. 화면으로 이동 중...`;
                    
                    // 지정된 화면으로 전환
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 600);
                } else {
                    submitBtn.disabled = false;
                    btnText.textContent = '로그인';
                    alertBox.className = 'text-xs rounded-lg p-3 font-mono bg-red-950/60 border border-red-500/50 text-red-300 block';
                    alertBox.textContent = '✗ ' + (data.message || '로그인에 실패했습니다.');
                }
            } catch (err) {
                submitBtn.disabled = false;
                btnText.textContent = '로그인';
                alertBox.className = 'text-xs rounded-lg p-3 font-mono bg-red-950/60 border border-red-500/50 text-red-300 block';
                alertBox.textContent = '✗ 서버와의 통신 중 오류가 발생했습니다.';
            }
        }
    </script>
</body>
</html>
